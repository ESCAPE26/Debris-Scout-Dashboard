<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost Track | Debris Scout AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      margin: 0;
    }
    .not-found-container {
      text-align: center;
      border: 1px solid var(--ocean-slate);
      background: linear-gradient(180deg, var(--midnight-navy) 0%, rgba(6, 17, 33, 0.4) 100%);
      padding: 60px 40px;
      border-radius: 8px;
      max-width: 500px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .radar-icon {
      margin-bottom: 24px;
      animation: sweep 4s linear infinite;
    }
    @keyframes sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 24px;
      letter-spacing: 2px;
      color: var(--warm-amber);
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
  </style>
</head>
<body>

  <div class="not-found-container">
    <svg class="radar-icon" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="30" stroke="var(--ocean-slate)" stroke-width="2" stroke-dasharray="4 6"/>
      <path d="M32 2V32L54 54" stroke="var(--text-muted)" stroke-width="2"/>
      <circle cx="32" cy="32" r="4" fill="var(--warm-amber)"/>
      <circle cx="48" cy="16" r="3" fill="var(--ocean-slate)"/>
    </svg>
    
    <h1>Lost Track</h1>
    <p>The trajectory you're looking for drifted outside the current mission window. We cannot locate this URL in the active catalog.</p>
    
    <a href="index.html" class="btn btn-primary" style="text-decoration: none;">Return to Mission Control</a>
  </div>

</body>
</html>
